[metadata]
# The last pwb-toolbox: the import name pwb_toolbox, kept as an alias of pwb.
# Each distribution owns one import name (paperswithbacktest: pwb; pwb-toolbox:
# pwb_toolbox), so upgrading from pwb-toolbox 0.1.x never deletes a file another
# distribution installed.
name = pwb-toolbox
version = 0.2.0
author = Papers With Backtest
author_email = hello@paperswithbacktest.com
description = Renamed: pip install paperswithbacktest (import pwb). This release keeps import pwb_toolbox working.
long_description =
    pwb-toolbox is now **paperswithbacktest** (`pip install paperswithbacktest`, `import pwb`).

    This release installs paperswithbacktest and keeps `import pwb_toolbox` working:
    every `pwb_toolbox.<module>` is the same module as `pwb.<module>`, with a
    DeprecationWarning. Replace `pwb_toolbox` with `pwb` in your imports.
long_description_content_type = text/markdown
url = https://paperswithbacktest.com
project_urls =
    Homepage = https://paperswithbacktest.com
    Source = https://github.com/paperswithbacktest/pwb-toolbox
license = MIT
classifiers =
    Development Status :: 7 - Inactive
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = pwb_toolbox
python_requires = >=3.10
install_requires =
    paperswithbacktest>=0.2.0

[options.extras_require]
tradewind =
    paperswithbacktest[tradewind]>=0.2.0
