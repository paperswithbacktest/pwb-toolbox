[metadata]
name = pwb-toolbox
version = 0.1.42
author = Papers With Backtest
author_email = hello@paperswithbacktest.com
description = A toolbox library for quant traders
long_description = file: README.md
long_description_content_type = text/markdown
url = https://paperswithbacktest.com
project_urls =
    Homepage = https://paperswithbacktest.com
    Documentation = https://paperswithbacktest.com/docs/
    Strategies = https://paperswithbacktest.com/strategies
    Datasets = https://paperswithbacktest.com/datasets
    Source = https://github.com/paperswithbacktest/pwb-toolbox
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.10
install_requires =
    backtrader
    beautifulsoup4
    ccxt
    click
    datasets
    deap
    ffn
    huggingface_hub
    ib_insync
    matplotlib
    numpy
    pandas
    pyarrow
    python-dateutil
    requests
    scikit-learn
    scipy
    tqdm
    transformers
    webdriver_manager

[options.extras_require]
# The Apache 2.0 engine; PWB_BACKTEST_ENGINE=tradewind selects it (see pwb_toolbox/engine.py).
tradewind =
    tradewind>=0.0.2
